[tool.poetry]
name = "voice-ai-agent-backend"
version = "2.0.0"
description = "Production-ready Voice AI Agent Backend with FastAPI"
authors = ["Voice AI Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
# Web Framework
fastapi = "^0.116.1"
uvicorn = {extras = ["standard"], version = "^0.32.1"}
pydantic = "^2.10.3"
pydantic-settings = "^2.6.1"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
alembic = "^1.14.0"

# Caching
redis = {extras = ["hiredis"], version = "^5.2.0"}
aiocache = "^0.12.2"

# AI & ML
openai = "^1.57.2"
transformers = "^4.47.1"
accelerate = "^1.2.1"
sentencepiece = ">=0.1.99"
numpy = ">=1.21.0,<2.0"
torch = "^2.5.1"
torchaudio = "^2.5.1"

# Audio Processing
soundfile = "^0.12.1"
scipy = "^1.14.1"
librosa = "^0.10.2"
speechbrain = ">=1.0.0"

# Utilities
python-dotenv = "^1.0.1"
python-multipart = "^0.0.17"
aiofiles = "^24.1.0"

# Monitoring
prometheus-client = "^0.21.0"
structlog = "^24.4.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.18.0"}

# Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
slowapi = "^0.1.9"
datasets = "^4.4.1"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.4"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.1"
faker = "^33.1.0"
factory-boy = "^3.3.1"

# Code Quality
ruff = "^0.8.4"
black = "^24.10.0"
mypy = "^1.13.0"
pre-commit = "^4.0.1"

# Documentation
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.48"

# Type stubs
types-redis = "^4.6.0"
types-aiofiles = "^24.1.0"
aiosqlite = "^0.21.0"

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Imported but unused

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | build
  | dist
  | alembic
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torch.*",
    "torchaudio.*",
    "soundfile.*",
    "librosa.*",
    "speechbrain.*",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
