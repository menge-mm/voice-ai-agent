services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: voiceai_postgres
    environment:
      POSTGRES_USER: voiceai_user
      POSTGRES_PASSWORD: voiceai_password
      POSTGRES_DB: voiceai_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceai_user -d voiceai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceai_network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: voiceai_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6385:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceai_network
    restart: unless-stopped

  # Backend API (Development)
  api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.dev
    container_name: voiceai_api
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://voiceai_user:voiceai_password@db:5432/voiceai_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - ../backend:/app
      - /app/.venv  # Exclude venv from volume mount
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voiceai_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: voiceai_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - voiceai_network
    restart: unless-stopped

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: voiceai_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - voiceai_network
    restart: unless-stopped

networks:
  voiceai_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
