<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Agent</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🎙️ Voice AI Agent</h1>
            <p class="subtitle">Speak or type to chat with AI</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Chat History -->
            <div class="chat-container" id="chatContainer">
                <div class="welcome-message">
                    <h2>Welcome! 👋</h2>
                    <p>Start a conversation by recording your voice or typing a message.</p>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <!-- Voice Input -->
                <div class="voice-input-section">
                    <canvas id="audioVisualizer" width="600" height="100"></canvas>

                    <div class="controls">
                        <button id="recordBtn" class="btn btn-primary" title="Start recording">
                            🎤 Record
                        </button>
                        <button id="stopBtn" class="btn btn-danger" disabled title="Stop recording">
                            ⏹️ Stop
                        </button>
                        <div class="status" id="status">Ready</div>
                    </div>
                </div>

                <!-- Text Input -->
                <div class="text-input-section">
                    <textarea
                        id="textInput"
                        class="text-input"
                        placeholder="Or type your message here..."
                        rows="3"
                    ></textarea>
                    <button id="sendBtn" class="btn btn-success">Send</button>
                </div>

                <!-- Settings -->
                <div class="settings">
                    <label class="toggle">
                        <input type="checkbox" id="ttsToggle" checked>
                        <span class="toggle-label">🔊 Enable TTS Response</span>
                    </label>

                    <label class="language-selector">
                        <span>Language:</span>
                        <select id="languageSelect" class="select">
                            <option value="en" selected>English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="it">Italian</option>
                            <option value="pt">Portuguese</option>
                            <option value="pl">Polish</option>
                            <option value="tr">Turkish</option>
                            <option value="ru">Russian</option>
                            <option value="nl">Dutch</option>
                            <option value="cs">Czech</option>
                            <option value="ar">Arabic</option>
                            <option value="zh-cn">Chinese</option>
                            <option value="ja">Japanese</option>
                            <option value="hu">Hungarian</option>
                            <option value="ko">Korean</option>
                            <option value="hi">Hindi</option>
                        </select>
                    </label>

                    <button id="clearBtn" class="btn btn-secondary btn-sm">Clear Chat</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by OpenAI Whisper, GPT-4, and Coqui XTTS-v2</p>
        </footer>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>Loading AI models...</p>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
